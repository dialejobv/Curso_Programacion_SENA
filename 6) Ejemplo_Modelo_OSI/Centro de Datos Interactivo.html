<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Centro de Datos Interactivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: escena isométrica fija a la izquierda, ficha de la parada a la derecha, riel de pasos debajo del encabezado. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#f5f8fb; --ink:#14233b; --muted:#566a85; --line:#d3dce7;
  --accent:#0b6e99; --accent-ink:#ffffff; --accent-soft:#dcecf4; --warn:#a85a00; --warn-soft:#fbefd9;
  --scene:#dfe8f0; --floor:#f7fafc; --floor-line:#c5d1de; --wall:#c9d5e2; --apron:#b9c6d4;
  --l7:#b83a4b; --l6:#c0622a; --l5:#a57a12; --l4:#3d8a4e; --l3:#1f8a8a; --l2:#2f6fc0; --l1:#6a55b8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c141f; --surface:#141f2e; --surface2:#1a2738; --ink:#e6edf6; --muted:#9bb0c8; --line:#2a3a50;
  --accent:#4db8e0; --accent-ink:#06202c; --accent-soft:#16384a; --warn:#f0b455; --warn-soft:#3a2c12;
  --scene:#101b29; --floor:#22324a; --floor-line:#33486a; --wall:#2c3f5c; --apron:#1a2638; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c141f; --surface:#141f2e; --surface2:#1a2738; --ink:#e6edf6; --muted:#9bb0c8; --line:#2a3a50;
  --accent:#4db8e0; --accent-ink:#06202c; --accent-soft:#16384a; --warn:#f0b455; --warn-soft:#3a2c12;
  --scene:#101b29; --floor:#22324a; --floor-line:#33486a; --wall:#2c3f5c; --apron:#1a2638; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{font:700 34px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;margin:0}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.chapters button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font:600 16px var(--display);letter-spacing:.6px;text-transform:uppercase}
.chapters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rail button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px 5px 6px;font-size:13px;white-space:nowrap}
.rail button b{display:grid;place-items:center;min-width:22px;height:22px;border-radius:4px;background:var(--surface2);font:600 12px var(--mono);color:var(--muted)}
.rail button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.rail button[aria-current="step"] b{background:var(--accent);color:var(--accent-ink)}

.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.scene{background:var(--scene);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (max-width:980px){.scene{position:static}}
.scene svg{display:block;width:100%;height:auto}
.scene-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink)}
.nav button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav button:disabled{opacity:.4;cursor:default}
.nav span{font:500 12px var(--mono);min-width:54px;text-align:center}

/* escena */
.floor{fill:var(--floor);stroke:var(--floor-line);stroke-width:1}
.wall{fill:var(--wall);stroke:var(--floor-line);stroke-width:.8}
.apron{fill:var(--apron)}
.tile{stroke:var(--floor-line);stroke-width:.5;fill:none;opacity:.7}
.zf{fill:transparent;stroke:var(--floor-line);stroke-width:1.2;stroke-dasharray:5 4;cursor:pointer;transition:fill .25s}
.zf:hover{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.zf.on{fill:color-mix(in srgb,var(--accent) 26%,transparent);stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
.obj{transition:opacity .3s;cursor:pointer}
svg.focus .obj:not(.on){opacity:.2}
.led{stroke-width:2;stroke-linecap:round}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1.6s steps(2) infinite}
.fan{transform-box:fill-box;transform-origin:center}
.fiber{fill:none;stroke:#f2a516;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:3 7;stroke-linecap:round;stroke-linejoin:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.pin{cursor:pointer;transition:opacity .3s}
.pin circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.pin .n{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.pin .t{font:600 13px var(--display);letter-spacing:.5px;text-transform:uppercase;fill:var(--ink);paint-order:stroke;stroke:var(--scene);stroke-width:4px;stroke-linejoin:round}
svg.focus .pin:not(.on){opacity:.45}
.pin.on circle{fill:var(--accent);stroke:var(--accent)}
.pin.on .n{fill:var(--accent-ink)}
.cloudtxt{font:600 12px var(--display);letter-spacing:.5px;text-transform:uppercase;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--scene);stroke-width:4px}
@media (prefers-reduced-motion:reduce){.blink,.flow{animation:none}}

/* ficha */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 13px var(--display);letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.card h2{font:700 30px/1.05 var(--display);letter-spacing:.3px;margin:2px 0 0;text-wrap:balance}
.lead{margin:0;max-width:65ch}
.items{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.items li{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;padding-top:8px;border-top:1px solid var(--line)}
.items b{font-weight:600}
.items span{color:var(--muted)}
@media (max-width:520px){.items li{grid-template-columns:minmax(0,1fr)}}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.fact small{display:block;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fact strong{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.ask{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 6px 6px 0;margin:0}
.ask b{display:block;font:600 12px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--warn)}
.viz{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:12px;min-width:0}
.viz h3{font:600 12px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;font:13px var(--mono);width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
table.t th{background:var(--accent-soft);font-weight:600}
table.t caption{caption-side:top;text-align:left;font:600 12px var(--mono);color:var(--muted);padding-bottom:3px}
table.t.wrapc td{white-space:normal;font-family:var(--body)}
pre.code{margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:12.5px/1.5 var(--mono);overflow-x:auto;white-space:pre}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

/* OSI */
.osi{display:grid;gap:3px}
.osi button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;border-radius:5px;padding:6px 10px;background:var(--c);color:#fff;opacity:.38;font-size:13.5px}
.osi button.on{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.osi button b{font:700 20px var(--display)}
.osi button i{font:500 11.5px var(--mono);font-style:normal;opacity:.9}
.pdu{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
.pdu span{padding:5px 9px;border-radius:4px;background:var(--c);color:#fff;font:500 12px var(--mono)}
.pdu span.bits{background:var(--l1);letter-spacing:1px;overflow-wrap:anywhere}
.jr{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:6px;align-items:end}
.jr h4{font:600 13px var(--display);letter-spacing:1px;text-transform:uppercase;margin:0 0 4px;text-align:center}
.stack{display:grid;gap:2px}
.stack div{background:var(--c);color:#fff;border-radius:4px;padding:3px 8px;font:500 12px var(--mono);opacity:.3;transition:opacity .2s}
.stack div.on{opacity:1}
.medium{align-self:end;height:26px;border-bottom:4px solid var(--l1);opacity:.3}
.medium.on{opacity:1}
.jstat{margin:10px 0 0;min-height:3.2em;font-size:13.5px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;font-weight:600;margin-top:8px}
.dbbox{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:4px;border:1px dashed var(--line);font:500 12px var(--mono);opacity:.4}
.dbbox.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:auto 20px minmax(0,1fr);gap:4px 6px;font:12.5px var(--mono)}
.kv span:nth-child(3n+1){background:var(--accent-soft);padding:3px 8px;border-radius:4px}
.kv span:nth-child(3n){padding:3px 0;overflow-wrap:anywhere}
.kv span:nth-child(3n+2){padding:3px 0;color:var(--muted)}
.gsvg text{font:500 11px var(--mono);fill:var(--ink)}
.gsvg .nd{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.gsvg .ed{stroke:var(--muted);stroke-width:1.3;fill:none}
.gsvg .el{fill:var(--muted);font-size:9.5px}
.gsvg .ax{stroke:var(--line);stroke-width:1}
.gsvg .ln{fill:none;stroke:var(--accent);stroke-width:2}
.gsvg .ar{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.gsvg .pt{fill:var(--accent)}
.gsvg .q{fill:var(--warn)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.tiers div{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)}
.tiers b{font:700 18px var(--display);display:block}
.tiers small{display:block;color:var(--muted);font-size:12px}
.tiers strong{font:600 13px var(--mono)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Centro de Datos Interactivo</h1>
      <p>Recorrido guiado para clase: la infraestructura, el modelo OSI y las bases de datos, parada por parada.</p>
    </div>
    <div class="chapters" id="chapters" role="group" aria-label="Capítulos"></div>
  </header>
  <nav class="rail" id="rail" aria-label="Paradas del capítulo"></nav>
  <div class="main">
    <section class="scene" aria-label="Plano isométrico del centro de datos">
      <svg id="svg" viewBox="0 0 840 590" role="img" aria-label="Centro de datos en vista isométrica"></svg>
      <div class="scene-foot">
        <span>Toca una zona del plano para ir a su parada. Teclas ← → para avanzar.</span>
        <div class="nav"><button id="prev" type="button">← Anterior</button><span id="count"></span><button id="next" type="button" class="go">Siguiente →</button></div>
      </div>
    </section>
    <article class="card" id="card" aria-live="polite"></article>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ================= ESCENA ISOMÉTRICA ================= */
const S=24,OX=385,OY=72,C=.866;
const P=(x,y,z=0)=>[OX+(x-y)*C*S,OY+(x+y)*.5*S-z*S];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));return `rgb(${c})`};
const poly=(a,fill,extra='')=>`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
function box(x,y,z,w,d,h,col){
  return poly([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)],shade(col,.8))
       + poly([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)],shade(col,.58))
       + poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],shade(col,1.12));
}
const faceY=(x,y,z,w,h,fill,extra='')=>poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y,z),P(x,y,z)],fill,extra);
const line3=(a,b,cls,extra='')=>{const p=P(...a),q=P(...b);return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" class="${cls}" ${extra}/>`};
const rect=(x,y,w,d,z=0)=>[P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z)];
let seed=7;const rand=()=>(seed=(seed*16807)%2147483647)/2147483647;

const objs=[];
const add=(zone,x,y,w,d,svg)=>objs.push({zone,k:x+w/2+y+d/2,svg});
function rack(zone,x,y,h,col,led,rows=6){
  let s=box(x,y,0,1,1.25,h,col);
  for(let i=0;i<rows;i++){const z=.35+i*((h-.6)/rows);const a=.14+rand()*.2,b=.55+rand()*.31;
    s+=line3([x+a,y+1.25,z],[x+b,y+1.25,z],'led'+(rand()>.6?' blink':''),`stroke="${led}" style="animation-delay:${(rand()*1.5).toFixed(2)}s"`);}
  add(zone,x,y,1,1.25,s);
}
// Climatización
[[.8,.8],[3,.8],[5.2,.8],[.8,3],[3,3],[5.2,3]].forEach(([x,y])=>{
  const c=P(x+.8,y+.7,1.3);
  add('clima',x,y,1.6,1.4,box(x,y,0,1.6,1.4,1.3,'#dfe5ea')
    +`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${.52*S*1.2247}" ry="${.52*S*.707}" fill="#5c6b7d"/>`
    +`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${.18*S*1.2247}" ry="${.18*S*.707}" fill="#c9d3dd"/>`
    +line3([x+.2,y+1.4,.5],[x+1.4,y+1.4,.5],'led','stroke="#3aa0d8"'));
});
// Energía
[9.2,12.2,15.2].forEach(x=>{
  add('energia',x,.8,2.7,1.3,box(x,.8,0,2.1,1.3,1.35,'#f0a020')+box(x+2.1,.8,0,.55,1.3,1.7,'#3d4756')
    +line3([x+.3,2.1,.9],[x+1.6,2.1,.9],'led','stroke="#7a4a00"'));
});
[9.2,10.5,11.8].forEach(x=>add('energia',x,3.2,1.1,1.2,box(x,3.2,0,1.1,1.2,2,'#e8ecf0')+faceY(x+.3,4.4,1.3,.5,.35,'#39c27a')));
[13.6,14.9].forEach(x=>add('energia',x,3.2,1.1,1.2,box(x,3.2,0,1.1,1.2,1.5,'#3f6fd0')+line3([x+.2,4.4,1],[x+.9,4.4,1],'led','stroke="#bcd3ff"')));
add('energia',17,3,1.7,1.6,box(17,3,0,1.7,1.6,1.6,'#8a96a4')+box(17.3,3.3,1.6,.3,.3,.4,'#c96f2e')+box(18.1,3.3,1.6,.3,.3,.4,'#c96f2e'));
// Sala TI
for(let i=0;i<7;i++){rack('ti',.8+i*1.12,6.8,2.7,'#2b3547','#4be08a');rack('ti',.8+i*1.12,10.6,2.7,'#2b3547','#4be08a');}
// Incendios
[[8.75,7.1],[8.75,10.9],[.15,9]].forEach(([x,y])=>add('fuego',x,y,.4,.4,box(x,y,0,.4,.4,1.5,'#d93a34')+box(x+.12,y+.12,1.5,.16,.16,.2,'#8c9aa8')));
// Almacenamiento
[[10.6,6.6],[12.3,6.6],[10.6,8.3],[12.3,8.3]].forEach(([x,y])=>{
  let s='';for(let k=0;k<3;k++){s+=box(x,y,k*.64,1.3,1.2,.58,'#42546f');
    for(let j=0;j<5;j++)s+=line3([x+.12+j*.22,y+1.2,k*.64+.14],[x+.12+j*.22,y+1.2,k*.64+.44],'led','stroke="#35d0c4" stroke-width="2.6"');}
  add('alm',x,y,1.3,1.2,s);
});
// Red
[['#2f6fc0','#bfe0ff'],['#b0463a','#ffd0c4'],['#1f8a8a','#c4fff4']].forEach(([c,l],i)=>rack('red',10.6+i*1.2,11.4,2.3,c,l,8));
// NOC
add('noc',15.8,5.9,3.4,.15,box(15.8,5.9,.4,3.4,.15,1.8,'#2b3547')+faceY(15.95,6.05,.6,3.1,1.4,'#57c8f0','opacity=".9"')
  +line3([16.2,6.05,1.0],[17.2,6.05,1.5],'led','stroke="#0b4f6e"')+line3([17.2,6.05,1.5],[17.9,6.05,1.2],'led','stroke="#0b4f6e"')+line3([17.9,6.05,1.2],[18.7,6.05,1.7],'led','stroke="#0b4f6e"'));
[7.3,8.9].forEach(y=>{let s=box(15.8,y,0,3.2,.8,.7,'#e4e9ee');
  [16.1,17.1,18.1].forEach(x=>{s+=box(x,y+.2,.7,.7,.08,.5,'#2b3547')+faceY(x+.05,y+.28,.75,.6,.4,'#57c8f0');});
  add('noc',15.8,y,3.2,.8,s);});
// Acceso y seguridad
add('seg',15.6,11.2,.3,2,box(15.6,11.2,0,.3,.9,1.1,'#8a96a4')+box(15.6,12.5,0,.3,.9,1.1,'#8a96a4')+faceY(15.6,12.1,.2,.3,.7,'#57c8f0','opacity=".7"'));
add('seg',17.6,11.4,1.2,1,box(17.6,11.4,0,1.2,1,.9,'#e4e9ee')+box(17.9,11.7,.9,.5,.08,.45,'#2b3547'));
add('seg',16.3,15.1,1.5,1.2,box(16.3,15.1,0,1.4,1.2,1.5,'#f1f4f7')+faceY(16.5,16.3,.7,1,.6,'#57c8f0')+box(16.2,15,1.5,1.6,1.4,.2,'#e2574c'));
add('seg',18.2,15.6,2.6,.2,box(18.2,15.6,0,.2,.2,1,'#3d4756')+box(18.4,15.65,.8,2.4,.1,.1,'#e2574c'));

function buildScene(){
  let s='';
  s+=poly(rect(13.5,14,8,3.4),'','class="apron"');

  const d='M'+fl.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');

}

const CH=[{id:'infra',t:'Infraestructura'},{id:'osi',t:'Modelo OSI'},{id:'bd',t:'Bases de datos'}];

/* ================= VISUALES OSI ================= */
function osiViz(n){
  let h=`<h3>Las siete capas</h3><div class="osi">`;
  for(let i=7;i>=1;i--)h+=`<button type="button" data-osi="${i}" class="${n===i||n===0?'on':''}" style="--c:var(--l${i})"><b>${i}</b><span>${OSI[i].name}</span><i>${OSI[i].pdu}</i></button>`;
  h+=`</div>`;
  if(n){const P=OSI[n];
    h+=`<h3 style="margin-top:12px">Unidad de datos en la capa ${n}: ${P.pdu}</h3><div class="pdu">`;
    if(n===1)h+=`<span class="bits">01001000 01010100 01010100 01010000 …</span>`;
    else{ if(n<=2)h+=`<span style="--c:var(--l2)">MAC</span>`; if(n<=3)h+=`<span style="--c:var(--l3)">IP</span>`; if(n<=4)h+=`<span style="--c:var(--l4)">TCP</span>`;
      h+=`<span style="--c:var(--l7)">Datos</span>`; if(n<=2)h+=`<span style="--c:var(--l2)">FCS</span>`; }
    h+=`</div><p style="margin:8px 0 0;font-size:13px;color:var(--muted)">Protocolos: ${P.proto}</p>`;
  } else h+=`<p style="margin:8px 0 0;font-size:13px;color:var(--muted)">Toca una capa para abrir su parada.</p>`;
  return h;
}
let jTimer=null;
function journeyViz(){
  const st=side=>`<div><h4>${side}</h4><div class="stack" data-side="${side}">${[7,6,5,4,3,2,1].map(i=>`<div data-l="${i}" style="--c:var(--l${i})">${i} ${OSI[i].name}</div>`).join('')}</div></div>`;
  return `<h3>Cliente y servidor</h3><div class="jr">${st('Cliente')}<div class="medium" id="jmed"></div>${st('Servidor')}</div>
  <div style="text-align:right"><span class="dbbox" id="jdb">SGBD · SELECT … WHERE id = 101</span></div>
  <p class="jstat" id="jstat">Pulsa el botón para ver el recorrido paso a paso.</p><button class="btn" type="button" id="jgo">Enviar petición</button>`;
}
function runJourney(){
  clearInterval(jTimer);
  const seq=[];[7,6,5,4,3,2,1].forEach(i=>seq.push(['Cliente',i,`Cliente · capa ${i} (${OSI[i].name}): ${OSI[i].enc}`]));
  seq.push(['m',0,'Medio físico: la señal viaja por Wi-Fi, cobre y fibra hasta el centro de datos. Los routers la encaminan por IP y los switches la entregan por MAC.']);
  [1,2,3,4,5,6,7].forEach(i=>seq.push(['Servidor',i,`Servidor · capa ${i} (${OSI[i].name}): ${OSI[i].dec}`]));
  seq.push(['db',0,'La aplicación consulta la base de datos. El motor lee los discos del almacenamiento y devuelve las notas.']);
  seq.push(['end',0,'La respuesta regresa por el mismo camino: baja las 7 capas en el servidor y sube las 7 capas en el cliente. La estudiante ve sus notas.']);
  let k=0;const card=$('#card');
  const tick=()=>{
    card.querySelectorAll('.stack div,.medium,.dbbox').forEach(e=>e.classList.remove('on'));
    const s=seq[k];if(!s){clearInterval(jTimer);return}
    if(s[0]==='m')$('#jmed').classList.add('on');
    else if(s[0]==='db')$('#jdb').classList.add('on');
    else if(s[0]==='end')card.querySelectorAll('.stack div,.medium,.dbbox').forEach(e=>e.classList.add('on'));
    else card.querySelector(`.stack[data-side="${s[0]}"] [data-l="${s[1]}"]`).classList.add('on');
    $('#jstat').textContent=s[2];k++;
  };
  tick();jTimer=setInterval(tick,1700);
}

/* ================= NAVEGACIÓN ================= */
let cur=0;
const firstOf=c=>STEPS.findIndex(s=>s.ch===c);
function render(){
  clearInterval(jTimer);
  const s=STEPS[cur],inCh=STEPS.filter(x=>x.ch===s.ch),pos=inCh.indexOf(s);
  $('#chapters').innerHTML=CH.map((c,i)=>`<button type="button" data-ch="${i}" aria-pressed="${i===s.ch}">${c.t}</button>`).join('');
  $('#rail').innerHTML=inCh.map((x,i)=>`<button type="button" data-i="${STEPS.indexOf(x)}" ${x===s?'aria-current="step"':''}><b>${i+1}</b>${esc(x.t)}</button>`).join('');
  const act=$('#rail [aria-current]');if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest',inline:'nearest'});
  $('#count').textContent=`${cur+1} / ${STEPS.length}`;
  $('#prev').disabled=cur===0;$('#next').disabled=cur===STEPS.length-1;
  let h=`<div><div class="eyebrow">${CH[s.ch].t} · parada ${pos+1} de ${inCh.length}</div><h2>${esc(s.t)}</h2></div><p class="lead">${esc(s.lead)}</p>`;
  if(s.viz)h+=`<div class="viz">${s.viz()}</div>`;
  if(s.items)h+=`<ul class="items">${s.items.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ul>`;
  if(s.facts)h+=`<div class="facts">${s.facts.map(([a,b])=>`<div class="fact"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div>`;
  if(s.q)h+=`<p class="ask"><b>Pregunta para la clase</b>${esc(s.q)}</p>`;
  $('#card').innerHTML=h;
  // escena
  const svg=$('#svg'),z=s.zones||[];
  svg.classList.toggle('focus',z.length>0);
  svg.querySelectorAll('.obj,.zf,.pin').forEach(e=>e.classList.toggle('on',z.includes(e.dataset.z)));
  $('#flow').toggleAttribute('hidden',!s.flow);
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render()}
const zoneStep=z=>STEPS.findIndex(s=>s.ch===0&&s.zones.length===1&&s.zones[0]===z||s.ch===0&&z==='fibra'&&s.zones[0]==='fibra');

buildScene();
const h0=CH.findIndex(c=>'#'+c.id===location.hash);if(h0>0)cur=firstOf(h0);
render();
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#chapters').onclick=e=>{const b=e.target.closest('[data-ch]');if(b)go(firstOf(+b.dataset.ch))};
$('#rail').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};
$('#card').onclick=e=>{const o=e.target.closest('[data-osi]');if(o)return go(STEPS.findIndex(s=>s.osi===+o.dataset.osi));if(e.target.id==='jgo')runJourney()};
const pick=e=>{const t=e.target.closest('[data-z]');if(!t)return;const z=t.dataset.z==='inet'?'fibra':t.dataset.z;const i=zoneStep(z);if(i>=0)go(i)};
$('#svg').addEventListener('click',pick);
$('#svg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e)}});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
})();
</script>
